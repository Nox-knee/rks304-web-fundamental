<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Profil Pribadi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">Shandy</div>
    <nav>
      <ul class="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="contact-section">
      <h1>Hubungi Saya</h1>
      <p>Silakan isi form di bawah ini untuk konsultasi, kolaborasi, atau pertanyaan lainnya.</p>

      <form class="contact-form">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" required>

        <label for="email">Alamat Email</label>
        <input type="email" id="email" name="email" required>

        <label for="kategori">Kategori / Keperluan</label>
        <select id="kategori" name="kategori">
          <option value="konsultasi">Konsultasi</option>
          <option value="kolaborasi">Kolaborasi Proyek</option>
          <option value="pertanyaan">Pertanyaan Umum</option>
        </select>

        <label for="pesan">Pesan</label>
        <textarea id="pesan" name="pesan" rows="5" required></textarea>

        <button type="submit">Kirim Pesan</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 M Ramadhan Suhandi. Dreams Surpass Nightmares.</p>
  </footer>

</body>
</html>
